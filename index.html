<style>
:root{--ink:#223d31;--muted:#647066;--paper:#f6f6ef;--line:#d9dfd2;--green:#255440;--serif:"Songti SC","Noto Serif CJK SC",STSong,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "DM Sans","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #c08f43;outline-offset:4px}button{border:0;background:none}header{border-bottom:1px solid var(--line);background:#fbfbf5}.bar,main{width:min(1140px,90%);margin:auto}.bar{min-height:76px;display:flex;align-items:center;gap:40px}.brand{display:flex;align-items:center;gap:10px;padding:0;font: bold 26px var(--serif);letter-spacing:3px}.mark{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:#f1ebc9}nav{align-self:stretch;display:flex;align-items:stretch;gap:28px}nav button{padding:3px 1px 0;color:var(--muted);font-size:14px;border-bottom:3px solid transparent}nav .active{color:var(--green);border-color:var(--green);font-weight:600}.local{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.icon{display:inline-block;width:20px;height:20px;vertical-align:middle;flex:none}.hero{position:relative;isolation:isolate;overflow:hidden;min-height:335px;background:#224a3c;border:1px solid #274d3e;border-radius:20px;color:#fbf9e9;display:flex;align-items:center}.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.hero-copy{padding:38px 5%;width:57%}.eyebrow{font:600 11px/1.5 "Courier New",monospace;letter-spacing:2.3px;color:#b8c8ac;display:flex;align-items:center;gap:10px}.eyebrow:before{content:"";width:25px;height:1px;background:currentColor}h1,h2,h3,p{margin:0}.hero h1{font:500 clamp(32px,3.6vw,54px)/1.4 var(--serif);letter-spacing:2px;margin:14px 0 8px}.hero p{color:#d0dcca;font-size:15px;line-height:1.85}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:white;border-radius:8px;padding:10px 18px;font-weight:550;transition:background .18s,transform .18s}.btn:hover{background:#32684d;transform:translateY(-1px)}.hero .btn{background:#f3e9bd;color:#263c29;margin-top:24px}.hero .btn:hover{background:#fff2bf}.section{margin-top:30px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}h2{font:600 24px/1.45 var(--serif);letter-spacing:1px}.note,.sub{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.method{position:relative;padding:20px;background:#fffef8;border:1px solid var(--line);border-radius:13px;text-align:left;transition:transform .18s,border-color .18s}.method:hover{transform:translateY(-3px);border-color:#9aae97}.tile{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px}.num{position:absolute;right:18px;top:20px;font:italic 17px Georgia,serif;color:#859082}.method h3{font:600 20px var(--serif);margin:15px 0 6px}.method p{font-size:13px;color:var(--muted)}main{padding:30px 0 48px}.link{color:var(--green);font-size:14px;padding:5px}.empty,.record{background:#fbfbf5;border:1px solid var(--line);border-radius:12px;padding:19px 22px;display:flex;align-items:center;gap:16px}.empty .tile{color:#6c806d;background:#e8eddf}.empty b{font-weight:550}.record{width:100%;text-align:left;margin-bottom:9px;justify-content:space-between}.record:hover{border-color:#8da48a}.record strong{overflow-wrap:anywhere}.record small{display:block;color:var(--muted)}.pill{background:#e8eddc;color:#425d41;border-radius:15px;padding:2px 10px;font-size:12px;white-space:nowrap}.card{max-width:790px;margin:16px auto;background:#fffef8;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,45px)}.back{display:block;margin:0 auto;width:min(790px,100%);text-align:left;padding:0;color:var(--muted)}.card h1,.history h1{font:600 31px/1.5 var(--serif);margin:8px 0 18px}.card h1,.quote,.answer{overflow-wrap:anywhere}.steps{display:flex;gap:5px;margin-bottom:20px}.steps span{height:4px;flex:1;background:#e8ecdf;border-radius:3px}.steps .done{background:#68906c}label{display:block;margin:18px 0 6px;font-weight:550}input,textarea{width:100%;border:1px solid #bac6b5;background:white;border-radius:8px;padding:10px 12px;outline:none}input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #25544018}textarea{min-height:92px;resize:vertical}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}.secondary{background:#edf0e5;color:var(--green)}.secondary:hover{background:#dde7d9}.quote{background:#edf2e7;border-left:3px solid #789073;padding:10px 14px;border-radius:4px;margin:8px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.opt{background:#f5f5ed;border-radius:12px;padding:15px}.opt label{font-size:14px}.opt textarea{min-height:65px}.smalltitle{font-size:12px;letter-spacing:1px;color:var(--muted)}.answer{white-space:pre-wrap}.history{max-width:900px;margin:auto}details{margin-top:18px}summary{cursor:pointer;color:var(--green)}dialog{border:1px solid var(--line);border-radius:16px;color:var(--ink);background:#fffef6;padding:28px;width:min(420px,90vw)}dialog::backdrop{background:#18342865}dialog h2{margin:12px 0 8px}dialog p{line-height:1.85}.notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263e32;color:white;padding:9px 18px;border-radius:10px;z-index:3;width:max-content;max-width:90vw}.notice:empty{display:none}.screen{animation:enter .22s ease-out}@keyframes enter{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:720px){.bar,main{width:92%}.bar{gap:20px;min-height:62px}.brand{font-size:23px}.local{font-size:0;gap:0}nav{gap:15px}main{padding-top:18px}.hero{min-height:310px}.hero-copy{padding:24px;width:62%}.hero h1{font-size:32px;max-width:5em}.hero p{font-size:13px}.grid{grid-template-columns:1fr 1fr;gap:10px}.method{padding:15px}.section{margin-top:23px}.note{font-size:12px}.pair{grid-template-columns:1fr}.card h1{font-size:25px}.empty,.record{padding:15px}.eyebrow{font-size:9px;letter-spacing:1.5px}.hero .btn{margin-top:18px}.heading h2{font-size:22px}}@media(max-width:560px){.hero-end{display:block}}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

<body><header><div class="bar"><button class="brand" id="brand"><span class="mark" id="logo"></span>择间</button><nav aria-label="主导航"><button id="homeNav">练习台</button><button id="historyNav">我的手记</button></nav><span class="local"><span id="localIcon"></span>仅保存在此设备</span></div></header><main id="app"></main><dialog id="info"></dialog><div class="notice" role="status" id="notice"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const paths={compass:'<circle cx="12" cy="12" r="9"/><path d="m16 7-3 7-6 3 3-7z"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1"/>',scale:'<path d="M12 3v16m-5 2h10M3 7l18-2M5 7l-3 7a4 4 0 0 0 6 0zm13-1-3 7a4 4 0 0 0 6 0z"/>',steps:'<path d="M2 20h7v-6h6V8h7M3 10l7-7M4 3h6v6"/>',loop:'<path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/><path d="M12 7v5l3 2"/>',book:'<path d="M5 3h13a1 1 0 0 1 1 1v16H6a3 3 0 0 1 0-6h13M5 3v12m4-8h6"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>'};
function icon(k){return '<svg aria-hidden="true" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+paths[k]+'</svg>'}
$('logo').innerHTML=icon('compass');$('localIcon').innerHTML=icon('lock');
const methods=[
['定目标','此刻最在意什么？','target','#e2ecdc','先写下你希望看到的一个具体变化。想不出来时，可以从“我最想改变哪一点”开始。'],
['看取舍','愿意接受哪种代价？','scale','#f3e9d0','把两个选项放在一起，各写下它吸引你的地方，以及你需要接受的代价。'],
['试一步','能先做点什么？','steps','#dfeaf0','缺少事实，就找人问一件具体的事。不了解自己的感受，就试一次成本低、能回头的小体验。'],
['再校准','这次更了解自己什么？','loop','#eee3e6','过几天打开这份手记，回想实际感受，留下一句下次做决定时想提醒自己的话。']];
const key='zejian.journal.v1';let records=[],current=null,view='home',storageOK=true,timer;
try{records=JSON.parse(localStorage.getItem(key)||'[]')}catch{storageOK=false}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg){$('notice').textContent=msg;clearTimeout(timer);timer=setTimeout(()=>$('notice').textContent='',3200)}
function persist(){try{localStorage.setItem(key,JSON.stringify(records));storageOK=true}catch{storageOK=false;notify('当前浏览器无法保存，关闭后可能丢失。')}}
function save(){current.updated=Date.now();if(!records.includes(current))records.unshift(current);persist()}
function go(v){view=v;render();window.scrollTo(0,0)}
function start(){current={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),step:1,state:'草稿',updated:Date.now()};go('edit')}
function listing(rows){return rows.length?rows.map(r=>'<button class="record" data-open="'+esc(r.id)+'"><span><strong>'+esc(r.issue||'未命名练习')+'</strong><small>'+new Date(r.updated).toLocaleDateString('zh-CN')+'</small></span><span class="pill">'+esc(r.state)+'</span></button>').join(''):'<div class="empty"><span class="tile">'+icon('book')+'</span><div><b>手记还是空白的</b><p class="sub">写下第一件犹豫的事，之后可以回来看看。</p></div></div>'}
function home(rows){return '<section class="hero"><canvas id="art" aria-hidden="true"></canvas><div class="hero-copy"><div class="eyebrow">DECISION JOURNAL</div><h1>给犹豫<span class="hero-end">一个方向</span></h1><p>从一件拿不准的小事开始，<br>写下在意的事，找到自己的下一步。</p><button class="btn" data-act="start">开始一次练习 '+icon('arrow')+'</button></div></section><section class="section"><div class="heading"><h2>练习指南</h2><span class="note">点开了解每一步</span></div><div class="grid">'+methods.map((m,i)=>'<button class="method" data-method="'+i+'"><span class="tile" style="background:'+m[3]+'">'+icon(m[2])+'</span><span class="num">0'+(i+1)+'</span><h3>'+m[0]+'</h3><p>'+m[1]+'</p></button>').join('')+'</div></section><section class="section"><div class="heading"><h2>最近手记</h2><button class="link" data-act="history">查看全部 →</button></div>'+listing(rows.slice(0,3))+'</section>'}
const btn=(a,t,secondary=false)=>'<button class="btn '+(secondary?'secondary':'')+'" data-act="'+a+'">'+t+'</button>';
function field(k,label,hint,short=false,required=false){const attr=' id="f_'+k+'" data-key="'+k+'" placeholder="'+hint+'" '+(required?'required':'');return '<label for="f_'+k+'">'+label+'</label>'+(short?'<input'+attr+' value="'+esc(current[k])+'">':'<textarea'+attr+'>'+esc(current[k])+'</textarea>')}
function priority(){return current.priority?'<div class="quote">我最在意 · '+esc(current.priority)+'</div>':''}
function edit(){let s=current.step,body='';
if(s===1)body='<h1>你正在犹豫什么？</h1>'+field('issue','我想决定…','比如，周末要不要去参加聚会',true,true)+field('priority','这一次，我最在意…','如果不容易回答，可以写下最想改变的一点。')+'<div class="actions">'+btn('compare','看看两个选项 →')+btn('choose','我已经有方向了',true)+'</div>';
if(s===2)body='<h1>把两个选项摆在一起</h1>'+priority()+'<div class="pair">'+['a','b'].map((k,i)=>'<div class="opt">'+field(k,'选项 '+(i?'B':'A'),'写下一个选择',true)+field(k+'Gain','我看重…','它吸引我的地方')+field(k+'Cost','我得接受…','它可能带来的代价')+'</div>').join('')+'</div><div class="actions">'+btn('choose','想想下一步 →')+btn('first','返回目标',true)+'</div>';
if(s===3)body='<h1>现在，你想怎么走？</h1>'+priority()+'<div class="actions" role="group" aria-label="选择进展">'+['我决定了','先试一步'].map((t,i)=>'<button class="btn '+((current.mode||0)===i?'':'secondary')+'" data-mode="'+i+'" aria-pressed="'+((current.mode||0)===i)+'">'+t+'</button>').join('')+'</div>'+(current.mode===1?field('trial','为了弄清这件事，我想先…','比如，问问组织者那天会有哪些活动。',false,true):field('decision','我的决定是…','写下你的选择，或留一句给自己的理由。',false,true))+'<div class="actions">'+btn('finish','收好这篇手记')+btn(current.via===2?'compare':'first','返回上一步',true)+'</div>';
return '<button class="back" data-act="home">← 练习台</button><section class="card"><div class="steps" aria-hidden="true">'+[1,2,3].map(n=>'<span class="'+(n<=s?'done':'')+'"></span>').join('')+'</div><div class="smalltitle">决策练习 · '+s+' / 3</div>'+body+'</section>'}
function read(){let r=current;return '<button class="back" data-act="history">← 我的手记</button><article class="card"><span class="pill">'+esc(r.state)+'</span><h1>'+esc(r.issue)+'</h1>'+priority()+(r.a||r.b||r.aGain||r.bGain||r.aCost||r.bCost?'<details><summary>回看这次取舍</summary><div class="pair">'+['a','b'].map((k,i)=>'<div class="opt"><b>'+esc(r[k]||('选项 '+(i?'B':'A')))+'</b><p class="answer">看重 · '+esc(r[k+'Gain']||'—')+'</p><p class="answer">接受 · '+esc(r[k+'Cost']||'—')+'</p></div>').join('')+'</div></details>':'')+'<label>'+(r.mode===1?'我想先试的一步':'我的决定')+'</label><p class="answer">'+esc(r.mode===1?r.trial:r.decision)+'</p>'+(r.state==='已决定'&&r.previousTrial?'<details><summary>回看之前的小尝试</summary><p class="answer">'+esc(r.previousTrial)+'</p></details>':'')+'<hr style="border:0;border-top:1px solid var(--line);margin:24px 0">'+field('review','经历之后，我发现自己其实很在意…','给下一次犹豫时的自己留句话。')+'<div class="actions">'+btn('review','保存复盘')+(r.mode===1?btn('decide','现在有决定了',true):'')+'</div></article>'}
function render(){let rows=[...records].sort((a,b)=>b.updated-a.updated);$('homeNav').className=['edit','home'].includes(view)?'active':'';$('historyNav').className=['history','read'].includes(view)?'active':'';$('app').innerHTML='<div class="screen">'+(view==='home'?home(rows):view==='history'?'<section class="history"><div class="heading"><h1>我的手记</h1>'+btn('start','＋ 新练习')+'</div>'+listing(rows)+'</section>':view==='edit'?edit():read())+'</div>';if(view==='home')draw()}
$('brand').onclick=$('homeNav').onclick=()=>go('home');$('historyNav').onclick=()=>go('history');
$('app').addEventListener('input',e=>{let k=e.target.dataset.key;if(k){current[k]=e.target.value;save()}});
$('app').addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;let d=el.dataset;
if(d.method!==undefined){let m=methods[+d.method];$('info').innerHTML='<span class="tile" style="background:'+m[3]+'">'+icon(m[2])+'</span><h2>'+m[0]+'</h2><p>'+m[4]+'</p><form method="dialog" class="actions"><button class="btn">知道了</button></form>';$('info').showModal();return}
if(d.open){current=records.find(r=>r.id===d.open);go(current.state==='草稿'?'edit':'read');return}
if(d.mode!==undefined){current.mode=+d.mode;save();render();$('app').querySelector('[aria-pressed="true"]').focus();return}
let a=d.act;if(a==='start'){start();return}if(['home','history'].includes(a)){go(a);return}
if(a==='review'){save();if(storageOK)notify('复盘已保存');return}
const advancing=(current.step===1&&['choose','compare'].includes(a))||a==='finish';
if(advancing){
 const input=$('app').querySelector('[required]');
 if(input&&!input.value.trim()){
  input.setCustomValidity('先写下一句话，就可以继续了。');
  input.reportValidity();input.setCustomValidity('');return
 }
}
if(a==='finish'){current.state=current.mode===1?'待尝试':'已决定';save();go('read');return}
if(a==='choose')current.via=current.step;
if(a==='decide'){current.previousTrial=current.trial;current.mode=0;current.state='草稿';current.via=2}
current.step=a==='first'?1:a==='compare'?2:3;save();go('edit')});
// A locally drawn field compass keeps the cover available offline at every size.
function draw(){
 const canvas=$('art');if(!canvas)return;const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);
 const bg=c.createLinearGradient(0,h,w,0);bg.addColorStop(0,'#193e32');bg.addColorStop(.55,'#284c3c');bg.addColorStop(1,'#45624c');c.fillStyle=bg;c.fillRect(0,0,w,h);
 // Sample continuous elevation and draw its level curves as a topographic map.
 const unit=8,cols=Math.ceil(w/unit)+1,rows=Math.ceil(h/unit)+1;
 const z=Array.from({length:rows},(_,j)=>Array.from({length:cols},(_,i)=>{const x=(i*unit-w*.63)/88,y=j*unit/76;return Math.sin(x*.82+y*.42)+.65*Math.cos(y*1.75-x*.4)+.45*Math.sin(x*1.56+Math.cos(y*1.4))+.12*Math.sin(x*3.6+y*2.8)}));
 const line=c.createLinearGradient(0,0,w,0);line.addColorStop(0,'rgba(183,202,153,.026)');line.addColorStop(.4,'rgba(183,202,153,.05)');line.addColorStop(1,'rgba(205,216,171,.33)');c.strokeStyle=line;c.lineWidth=.8;
 for(let level=-2.2;level<2.2;level+=.098){c.beginPath();for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){const v=[z[j][i],z[j][i+1],z[j+1][i+1],z[j+1][i]],xx=[0,1,1,0],yy=[0,0,1,1];let count=0;for(let e=0;e<4;e++){let f=(e+1)%4;if((v[e]>level)===(v[f]>level))continue;let t=(level-v[e])/(v[f]-v[e]),px=(i+xx[e]+t*(xx[f]-xx[e]))*unit,py=(j+yy[e]+t*(yy[f]-yy[e]))*unit;if(count++%2)c.lineTo(px,py);else c.moveTo(px,py)}}c.stroke()}
 const r=Math.min(h*.355,w*(w<560?.202:.163));c.save();c.translate(w*(w<560?.824:.764),h*.55);c.rotate(.19);c.scale(r/100,r/100*.94);
 const grad=(a,b,d,e,stops)=>{let g=c.createLinearGradient(a,b,d,e);stops.forEach(([x,v])=>g.addColorStop(x,v));return g};
 const brass=grad(-90,-90,95,85,[[0,'#e5cb8e'],[.22,'#a88e51'],[.44,'#f2dfa2'],[.65,'#967541'],[.83,'#d7be81'],[1,'#887043']]);
 const circle=(x,y,rad,fill,stroke,width=1)=>{c.beginPath();c.arc(x,y,rad,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}};
 c.shadowColor='#0e201bc9';c.shadowBlur=14;c.shadowOffsetY=10;circle(0,4,101,'#584f37');c.shadowColor='transparent';
 circle(0,-121,16,null,'#736444',6);circle(0,-122,16,null,brass,3.6);c.fillStyle=brass;c.fillRect(-6,-112,12,17);
 circle(0,0,101,brass,'#dec990');circle(0,0,97,null,'#726340',1.7);circle(0,0,94,'#324235','#f5e2a8',2);
 const face=c.createRadialGradient(-25,-40,3,18,25,125);face.addColorStop(0,'#fff9dc');face.addColorStop(.66,'#eae5c6');face.addColorStop(1,'#c7bc95');circle(0,0,90,face,'#918559',1);
 circle(0,0,82,null,'#9d987b',.7);circle(0,0,58,null,'#a7a88c',.65);circle(0,0,48,null,'#b7b498',.5);
 for(let n=0;n<120;n++){c.save();c.rotate(n*Math.PI/60);c.strokeStyle='#52604c';c.lineWidth=n%10===0?1.7:.65;c.beginPath();c.moveTo(0,-86);c.lineTo(0,n%10===0?-77:n%5===0?-80:-83);c.stroke();c.restore()}
 c.textAlign='center';c.textBaseline='middle';for(let n=0;n<8;n++){let angle=n*Math.PI/4;c.fillStyle=n===0?'#965334':'#344739';c.font=(n%2?'8':'bold 17')+'px Georgia';c.fillText(['N','NE','E','SE','S','SW','W','NW'][n],Math.sin(angle)*69,-Math.cos(angle)*69)}
 function poly(points,fill){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill()}
 for(let i=0;i<8;i++){c.save();c.rotate(i*Math.PI/4);let len=i%2?36:55;poly([[0,-len],[7,0],[0,0]],'#9a9e81');poly([[0,-len],[-7,0],[0,0]],'#657564');c.restore()}
 c.rotate(.52);c.shadowColor='#26382a70';c.shadowBlur=3;c.shadowOffsetY=2;poly([[0,-70],[9,1],[0,68],[-9,0]],'#945c3c');c.shadowColor='transparent';poly([[0,-70],[0,0],[-9,0]],'#bf7549');poly([[0,-70],[9,1],[0,0]],'#965332');poly([[0,68],[9,1],[0,0]],'#536555');poly([[0,68],[-9,0],[0,0]],'#84927b');circle(0,0,7,brass,'#736744',1);circle(-.5,-.7,3.5,'#615c46','#e9d69d',1);c.restore()
